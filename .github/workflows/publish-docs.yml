name: Publish public docs

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-docs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_NAME: "Novel"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: |
          python3 -m venv .publish-venv
          .publish-venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements-docs.txt

      - name: Test publication allowlist
        run: |
          .publish-venv/bin/coverage run -m unittest discover -s tests
          .publish-venv/bin/coverage report --fail-under=80

      - name: Build allowlisted documentation
        run: |
          .publish-venv/bin/python scripts/build_public_docs.py \
            --repository . \
            --destination .publish/docs \
            --site-name "$SITE_NAME"
          .publish-venv/bin/mkdocs build --config-file mkdocs.yml
          .publish-venv/bin/python scripts/validate_built_site.py \
            --site .publish/site \
            --allowed-origin https://docs.gmy.zone
          test -f .publish/site/index.html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site-${{ github.sha }}
          path: .publish/site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: docs-production
      url: "https://docs.gmy.zone/novel/"
    permissions: {}
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-site-${{ github.sha }}
          path: .publish/site

      - name: Configure restricted SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.DOCS_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/docs-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/docs-deploy ~/.ssh/known_hosts

      - name: Deploy immutable release
        env:
          DEPLOY_HOST: ${{ vars.DOCS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DOCS_DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9_-]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          tar -C .publish/site -czf - . | \
            ssh -i ~/.ssh/docs-deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
              "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
